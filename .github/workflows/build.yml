# Builds the Zom's MRP desktop app on GitHub's machines: Windows, macOS and Linux installers.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.
# Every run keeps the files under the run's "Artifacts"; a tag also makes a draft release with them.
# The Mac app is ad-hoc signed, so it opens after Privacy & Security › Open Anyway. With the Apple
# secrets set (see README, "Signing the Mac app"), it's signed with a Developer ID and notarized instead.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            args: "--bundles nsis"
          - platform: macos-latest
            name: macos
            args: "--target universal-apple-darwin --bundles dmg"
          - platform: ubuntu-22.04
            name: linux
            args: "--bundles deb,rpm,appimage"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm test

      # Signs with the Apple secrets when they are set (an empty APPLE_CERTIFICATE would make the build
      # try to import nothing), and ad-hoc ("-") otherwise, which a downloaded Mac app needs to open at all.
      - name: Mac signing and notarizing
        if: matrix.name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple secrets: the Mac app is ad-hoc signed."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then { echo "$v<<END_$v"; printf '%s\n' "${!v}"; echo "END_$v"; } >> "$GITHUB_ENV"; fi
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Zom's MRP ${{ github.ref_name }}"
          releaseBody: "Installers for Windows, macOS (Apple silicon and Intel, macOS 10.15 or later) and Linux. The server is the Docker image ghcr.io/zombeatz/zoms-mrp-server; see the README."
          releaseDraft: true
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: zoms-mrp-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
