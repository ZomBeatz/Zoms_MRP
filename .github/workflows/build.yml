# Builds the Zom's MRP desktop app on GitHub's machines: Windows, macOS and Linux installers.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.
# Every run keeps the files under the run's "Artifacts"; a tag also makes a draft release with them.
# The Mac app is ad-hoc signed, so it opens after Privacy & Security › Open Anyway. With the Apple
# secrets set (see README, "Signing the Mac app"), it's signed with a Developer ID and notarized instead.
# With the updater key set (README, "Updates"), the installers can update themselves: the release also
# gets signed update files and latest.json (the "Update files" job), which the app checks once the
# release is published. That job fails with the reason if a system is missing or signed with the wrong key.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            args: "--bundles nsis"
          - platform: macos-latest
            name: macos
            # The .app bundle as well: the updater installs the Mac app from its .app.tar.gz.
            args: "--target universal-apple-darwin --bundles app,dmg"
          - platform: ubuntu-22.04
            name: linux
            args: "--bundles deb,rpm,appimage"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm test

      # The desktop app's own tests, including that the window may call every command it has.
      - name: Desktop app tests
        if: matrix.name == 'linux'
        run: npm run build && cargo test --manifest-path src-tauri/Cargo.toml

      # Signs with the Apple secrets when they are set (an empty APPLE_CERTIFICATE would make the build
      # try to import nothing), and ad-hoc ("-") otherwise, which a downloaded Mac app needs to open at all.
      - name: Mac signing and notarizing
        if: matrix.name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple secrets: the Mac app is ad-hoc signed."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then { echo "$v<<END_$v"; printf '%s\n' "${!v}"; echo "END_$v"; } >> "$GITHUB_ENV"; fi
          done

      # Updates: with the updater key's secret and its public half (a repository variable), the build
      # signs update files and the app gets the public key to check them. Without them, nothing changes
      # and the app doesn't update itself.
      - name: Updater key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "No updater key: this build won't update itself."
            exit 0
          fi
          if [ -z "$PUBKEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but the TAURI_UPDATER_PUBKEY variable isn't (README, Updates)."
            exit 1
          fi
          # Try the key before the long build: the password has to open it, and the public key in the
          # variable has to be its other half (the same key ID), or installed apps would refuse the update.
          printf 'zoms-mrp' > "$RUNNER_TEMP/key-check.txt"
          if ! npx tauri signer sign "$RUNNER_TEMP/key-check.txt" < /dev/null > /dev/null; then
            echo "::error::The updater key didn't open: check TAURI_SIGNING_PRIVATE_KEY_PASSWORD (README, Updates)."
            exit 1
          fi
          node -e '
            const id = (b64) => Buffer.from(Buffer.from(b64.trim(), "base64").toString().split("\n")[1], "base64").subarray(2, 10).toString("hex");
            const sig = id(require("fs").readFileSync(process.argv[1], "utf8")), pub = id(process.env.PUBKEY);
            if (sig !== pub) { console.log("::error::TAURI_UPDATER_PUBKEY is not the public half of TAURI_SIGNING_PRIVATE_KEY (README, Updates)."); process.exit(1); }
            console.log(`::notice::Updater key works (key ID ${pub}).`);
          ' "$RUNNER_TEMP/key-check.txt.sig"
          # Into tauri.conf.json itself (on this runner only), not a --config file: tauri-action reads that file
          # to know which update files to look for and to write latest.json, and it can't see a --config file.
          # With a separate file it looked for the old .tar.gz files, found no signature, and skipped
          # latest.json, so installed apps found nothing to update to (0.2.5 and 0.2.6).
          node -e '
            const f = "src-tauri/tauri.conf.json", c = JSON.parse(require("fs").readFileSync(f, "utf8"));
            c.bundle.createUpdaterArtifacts = true;
            c.plugins.updater.pubkey = process.env.PUBKEY.trim();
            require("fs").writeFileSync(f, JSON.stringify(c, null, 2));
          '

      # Running again for the same tag (to sign the Mac app, say) replaces this system's files in the
      # draft release instead of failing because they're already there.
      - name: Remove this system's files from an earlier run
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ matrix.name }}" in
            windows) ext='\.exe(\.sig)?$' ;;
            macos) ext='\.(dmg|app\.tar\.gz(\.sig)?)$' ;;
            linux) ext='\.(deb|rpm|AppImage)(\.sig)?$' ;;
          esac
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -E "$ext" | while IFS= read -r f; do
                echo "Replacing $f"
                gh release delete-asset "${{ github.ref_name }}" "$f" --repo "${{ github.repository }}" --yes
              done || true

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Zom's MRP ${{ github.ref_name }}"
          releaseBody: "Installers for Windows, macOS (Apple silicon and Intel, macOS 10.15 or later) and Linux. The server is the Docker image ghcr.io/zombeatz/zoms-mrp-server; see the README."
          releaseDraft: true
          prerelease: false
          # latest.json comes from the "Update files" job below, once all three systems are in the release.
          includeUpdaterJson: false

      - uses: actions/upload-artifact@v6
        with:
          name: zoms-mrp-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # latest.json, which installed copies read to find a new version: written once every system's files are
  # in the draft release, with each signature checked against the key installed copies trust. A missing
  # file or the wrong key fails here with the reason, instead of a release that quietly never updates.
  update-files:
    needs: desktop
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Write latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "No updater key: this release won't update installed copies."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/update"
          cd "$RUNNER_TEMP/update"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > assets.txt
          gh release download "$TAG" --repo "$REPO" --pattern '*.sig' --clobber
          node "$GITHUB_WORKSPACE/.github/scripts/update-files.mjs" .
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
