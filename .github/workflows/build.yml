# Builds the Zom's MRP desktop app on GitHub's machines: Windows, macOS and Linux installers.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.
# Every run keeps the files under the run's "Artifacts"; a tag also makes a draft release with them.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            args: "--bundles nsis"
          - platform: macos-latest
            name: macos
            args: "--target universal-apple-darwin --bundles dmg"
          - platform: ubuntu-22.04
            name: linux
            args: "--bundles deb,rpm,appimage"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Zom's MRP ${{ github.ref_name }}"
          releaseBody: "Installers for Windows, macOS and Linux. The server is the Docker image ghcr.io/zombeatz/zoms-mrp-server; see the README."
          releaseDraft: true
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: zoms-mrp-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
