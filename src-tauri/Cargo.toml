[package]
name = "zoms-mrp"
version = "0.2.4"
description = "Zom's MRP: the Mission Ready Planner on one computer"
license = "MIT"
edition = "2021"

[lib]
name = "zoms_mrp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
